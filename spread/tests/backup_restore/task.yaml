summary: Percona Distribution backup and restore tests (XtraBackup)

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  CMD="percona-distribution-mysql-pxc.mysql -u root"
  SOCK=/var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock
  DATA=/var/snap/percona-distribution-mysql-pxc/common/data
  BACKUP=/var/snap/percona-distribution-mysql-pxc/common/backup

  echo "Creating test data"
  ${CMD} -e "CREATE DATABASE bkp;"
  ${CMD} -e "CREATE TABLE bkp.t (id INT PRIMARY KEY, v VARCHAR(50));"
  ${CMD} -e "INSERT INTO bkp.t VALUES (1, 'precious');"

  echo "Taking hot backup"
  percona-distribution-mysql-pxc.xtrabackup --backup -u root -S ${SOCK} \
    --datadir=${DATA} --target-dir=${BACKUP}

  echo "Preparing backup"
  percona-distribution-mysql-pxc.xtrabackup --prepare --target-dir=${BACKUP}

  echo "Simulating data loss"
  ${CMD} -e "DROP DATABASE bkp;"
  snap stop percona-distribution-mysql-pxc.mysqld
  rm -rf ${DATA}
  mkdir ${DATA}
  chown snap_daemon:root ${DATA}
  # xtrabackup has no setpriv wrapper (see snap/snapcraft.yaml), so
  # --copy-back below runs confined as this shell's own caller (root here,
  # under strict jailmode, without DAC-override). It only matches this
  # directory's GROUP (root), so group needs its own write bit or the
  # restore fails with "Can't create/write to file ... (Permission denied)".
  chmod g+w ${DATA}

  echo "Restoring"
  percona-distribution-mysql-pxc.xtrabackup --copy-back --target-dir=${BACKUP} --datadir=${DATA}
  chown -R snap_daemon:root ${DATA}
  chmod go-rwx ${DATA}

  # Galera: make the restored node bootstrappable regardless of how the
  # grastate arrived.
  GRA=/var/snap/percona-distribution-mysql-pxc/common/data/grastate.dat
  if [ -f "$GRA" ]; then
      sed -i 's/^safe_to_bootstrap:.*/safe_to_bootstrap: 1/' "$GRA"
  fi

  snap start percona-distribution-mysql-pxc.mysqld
  until ${CMD} -e "SELECT 1;" &>/dev/null; do
    echo "Waiting for mysql to be available..."
    sleep 1
  done
  ${CMD} -e "SELECT v FROM bkp.t WHERE id = 1;" | grep -q precious

restore: |
  snap remove percona-distribution-mysql-pxc --purge --terminate
