summary: HAProxy routes MySQL traffic and health-checks via clustercheck

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  apt-get update
  apt-get install -y socat
  for _ in $(seq 60); do
    test -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock && break
    sleep 2
  done

execute: |
  SNAPNAME=percona-distribution-mysql-pxc
  # TCP user for the proxied connection (auth_socket only works locally).
  "$SNAPNAME.mysql" -u root -e "CREATE USER 'hap'@'127.0.0.1' IDENTIFIED BY 'HapTest123!'; GRANT SELECT ON *.* TO 'hap'@'127.0.0.1';"
  # Diagnostic: time a direct clustercheck invocation. snap-confine's
  # cold-exec latency per invocation can be significant, and each HAProxy
  # health probe forks+execs this snap app fresh -- capture the timing in
  # the job log to confirm/refute that theory. Bounded so a genuinely
  # broken clustercheck (bad creds/cnf under confinement) can't hang here.
  timeout 30 bash -c "time $SNAPNAME.clustercheck" </dev/null || echo "clustercheck diagnostic exited rc=$?"
  # clustercheck behind an HTTP listener on :9200. Bounded lifetime so a
  # stuck listener can never outlive the test (restore also pkills it).
  timeout 300 socat TCP-LISTEN:9200,fork,reuseaddr EXEC:"$SNAPNAME.clustercheck" &
  CLUSTERCHECK_PID=$!
  # Live HAProxy config: frontend :13306 -> local mysqld, health via :9200.
  # The probe cadence (inter/downinter/rise/fall) and "timeout check" are
  # deliberately relaxed beyond HAProxy's tight defaults: each health
  # check forks+execs the clustercheck snap app via socat, and
  # snap-confine's cold-exec latency can exceed a 2s probe interval,
  # causing HAProxy to reset the check connection before clustercheck
  # replies -- the backend then never converges to UP.
  cat > /var/snap/$SNAPNAME/current/etc/haproxy/haproxy.cfg <<'EOF'
  global
      maxconn 256
      stats socket /var/snap/percona-distribution-mysql-pxc/current/run/haproxy.sock mode 660 level admin
  defaults
      mode tcp
      timeout connect 10s
      timeout client 1m
      timeout server 1m
      timeout check 10s
  frontend pxc-front
      bind 127.0.0.1:13306
      default_backend pxc-back
  backend pxc-back
      option httpchk GET /
      server node1 127.0.0.1:3306 check port 9200 inter 5s downinter 5s rise 2 fall 3
  EOF
  timeout 60 snap start "$SNAPNAME.haproxy"
  # Round-trip through the proxy once the health check marks the node UP.
  # `timeout` bounds each attempt: if HAProxy accepts the TCP connection
  # but never forwards data (e.g. the backend health check never
  # converges), the mysql client has no built-in timeout of its own and
  # can otherwise block far longer than this loop's nominal budget. The
  # iteration budget is widened to tolerate the relaxed 5s probe cadence
  # above (fall/rise convergence needs multiple 5s intervals).
  ok=0
  for _ in $(seq 60); do
    if timeout 5 "$SNAPNAME.mysql" -h 127.0.0.1 -P 13306 -u hap -pHapTest123! -e "SELECT 1" 2>/dev/null | grep -q 1; then
      ok=1; break
    fi
    sleep 2
  done
  [ "$ok" = 1 ]
  # Backend reported UP on the stats socket
  echo "show stat" | timeout 5 socat stdio unix-connect:/var/snap/$SNAPNAME/current/run/haproxy.sock | grep pxc-back | grep -q UP
  kill "$CLUSTERCHECK_PID" || true

restore: |
  pkill -f "TCP-LISTEN:9200" || true
  timeout 120 snap remove percona-distribution-mysql-pxc --purge --terminate || true
