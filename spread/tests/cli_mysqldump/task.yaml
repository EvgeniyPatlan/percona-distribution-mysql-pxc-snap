summary: Percona XtraDB Cluster mysqldump CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqldump"

  CMD="percona-distribution-mysql-pxc.mysql -u root"
  CMD_DUMP="percona-distribution-mysql-pxc.mysqldump -u root --single-transaction"

  echo "Creating test db"
  ${CMD} -e "CREATE DATABASE test_db;"
  ${CMD} -e "USE test_db; CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50));"
  ${CMD} -e "INSERT INTO test_db.test_table (id, name) VALUES (1, 'test_name');"

  echo "Dump test db"
  # --set-gtid-purged=OFF: PXC (Galera) defaults GTID_MODE=ON, so
  # mysqldump embeds a SET @@GLOBAL.GTID_PURGED=... statement near the top
  # of the dump whenever the server has GTIDs. Restoring that onto this
  # same live server (which never purged anything) fails, and the mysql
  # CLI aborts the whole restore at that first error -- before it ever
  # reaches the CREATE DATABASE statement -- which is why the later SELECT
  # sees "Unknown database". This suite only checks a plain dump/restore
  # round trip, not GTID preservation, so skip it as mysqldump's own
  # warning suggests.
  ${CMD_DUMP} --set-gtid-purged=OFF --databases test_db >test_db.sql

  echo "Drop test db"
  ${CMD} -e "DROP DATABASE test_db;"

  echo "Restore test db"
  cat test_db.sql | ${CMD}

  ${CMD} -e "SELECT * FROM test_db.test_table WHERE id = 1;"

  ${CMD} -e "DROP DATABASE test_db;"

restore: |
  snap remove percona-distribution-mysql-pxc --purge --terminate
