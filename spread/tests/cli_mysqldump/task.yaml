summary: Percona XtraDB Cluster mysqldump CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqldump"

  CMD="percona-distribution-mysql-pxc.mysql -u root"
  CMD_DUMP="percona-distribution-mysql-pxc.mysqldump -u root --single-transaction --set-gtid-purged=OFF"

  echo "Creating test db"
  ${CMD} -e "CREATE DATABASE test_db;"
  ${CMD} -e "USE test_db; CREATE TABLE test_table (id INT PRIMARY KEY, name VARCHAR(50));"
  ${CMD} -e "INSERT INTO test_db.test_table (id, name) VALUES (1, 'test_name');"

  echo "Dump test db"
  # This suite verifies the mysqldump binary's output, not a full
  # dump/restore round trip: a logical-dump replay is not a supported PXC
  # workflow under pxc_strict_mode=ENFORCING (the default here), which
  # forbids the LOCK TABLES ... WRITE statements mysqldump emits by
  # default (--add-locks) -- replaying those fails with ERROR 1105.
  # Backup/restore itself is covered separately by the backup_restore
  # suite via XtraBackup, PXC's supported mechanism.
  # --single-transaction avoids taking a global lock at dump time;
  # --set-gtid-purged=OFF avoids embedding a GTID_PURGED statement (this
  # Galera build defaults GTID_MODE=ON).
  # Piping through `cat` before the redirect matters: under strict/jailmode
  # confinement, redirecting a confined snap app's stdout DIRECTLY to a
  # file yields a silent 0-byte file with exit 0 (empirically confirmed);
  # `| cat >file` is the working form.
  ${CMD_DUMP} --databases test_db | cat >test_db.sql

  echo "Verify dump content"
  grep -q "CREATE TABLE" test_db.sql
  grep -q "test_name" test_db.sql

  ${CMD} -e "DROP DATABASE test_db;"

restore: |
  snap remove percona-distribution-mysql-pxc --purge --terminate
