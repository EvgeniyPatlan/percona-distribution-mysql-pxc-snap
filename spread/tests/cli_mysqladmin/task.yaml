summary: Percona XtraDB Cluster mysqladmin CLI tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  until [ -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock ]; do
    echo "Waiting for mysqld.sock"
    sleep 1
  done

execute: |
  echo "Testing mysqladmin"

  CMD="percona-distribution-mysql-pxc.mysqladmin -u root"

  for subcmd in status version ping variables; do
    echo "mysqladmin ${subcmd}"
    eval "${CMD}" "${subcmd}"
  done

  eval "${CMD} create testdb"
  yes | eval "${CMD} drop testdb"

restore: |
  snap remove percona-distribution-mysql-pxc --purge --terminate
