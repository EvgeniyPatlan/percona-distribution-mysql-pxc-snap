# HAProxy configuration for the _NAME_ snap.
# This file is seeded to /var/snap/_NAME_/current/etc/haproxy/haproxy.cfg
# on install; edit it there and restart with:
#   sudo snap restart _NAME_.haproxy

global
    maxconn 1024
    stats socket /var/snap/_NAME_/current/run/haproxy.sock mode 660 level admin
    log stderr format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m

# Example Percona XtraDB Cluster frontend/backend. Uncomment and list one
# "server" line per cluster node. The health check uses clustercheck
# (percona-distribution-mysql-pxc.clustercheck behind an HTTP listener on
# port 9200, e.g. via socat or xinetd on the node).
#
# frontend pxc-front
#     bind *:13306
#     default_backend pxc-back
#
# backend pxc-back
#     option httpchk GET /
#     server node1 127.0.0.1:3306 check port 9200 inter 5s rise 2 fall 2
