name: percona-distribution-mysql-pxc
base: core26
version: '8.4.10-10'
summary: Percona Distribution for MySQL (PXC-based) in a snap.
description: |
  Percona Distribution for MySQL (PXC variant) combines Percona XtraDB
  Cluster with the best components from the Percona ecosystem, all tested
  to work together: Percona XtraBackup for hot physical backups, ProxySQL
  and HAProxy for load balancing, replication-manager for asynchronous
  replica failover, and Percona Toolkit's command-line utilities.

  On install the snap initializes the data directory and bootstraps a
  single-node cluster; connect immediately with:
    sudo percona-distribution-mysql-pxc.mysql -u root
  Join more nodes by setting wsrep_cluster_address in
  /var/snap/percona-distribution-mysql-pxc/current/etc/mysqld.cnf.

  Hot backups work out of the box against this snap's own server:
    sudo percona-distribution-mysql-pxc.xtrabackup --backup -u root \
      -S /var/snap/percona-distribution-mysql-pxc/current/run/mysqld.sock \
      --target-dir=/var/snap/percona-distribution-mysql-pxc/common/backup

  Percona Toolkit tools are exposed as individual commands, e.g.:
    sudo percona-distribution-mysql-pxc.pt-summary
    sudo percona-distribution-mysql-pxc.pt-query-digest \
      /var/snap/percona-distribution-mysql-pxc/common/slow.log
  Input files for the toolkit commands must live under
  /var/snap/percona-distribution-mysql-pxc/common (the snap cannot read
  your home directory).

  Optional services (disabled by default, start with `snap start`):
    .proxysql — ProxySQL; admin interface :6032 on ALL interfaces (default
      credentials admin:admin — CHANGE BOTH BEFORE STARTING on a routable
      host), proxy interface :6033; config seeded at
      /var/snap/percona-distribution-mysql-pxc/current/etc/proxysql/proxysql.cnf.
      The proxysql-admin tool needs --proxysql-username/--proxysql-password
      (or a proxysql-admin.cnf passed via --config-file) and proxysql-status
      needs --login-file or a ~/.my.cnf; no default config is shipped.
    .haproxy — HAProxy (TCP mode); config seeded at
      /var/snap/percona-distribution-mysql-pxc/current/etc/haproxy/haproxy.cfg
      with a commented example PXC backend — configure it before starting;
      stats socket at /var/snap/percona-distribution-mysql-pxc/current/run/haproxy.sock.
    .garbd — Galera arbitrator; configure with
      `snap set percona-distribution-mysql-pxc garbd.address=... garbd.group=...`.

  The Percona telemetry agent is not shipped and server-side telemetry is
  disabled by default.
title: Percona Distribution for MySQL (PXC)
contact: https://github.com/EvgeniyPatlan/percona-distribution-mysql-pxc-snap/issues
issues: https://github.com/EvgeniyPatlan/percona-distribution-mysql-pxc-snap/issues
source-code: https://github.com/EvgeniyPatlan/percona-distribution-mysql-pxc-snap
website: https://www.percona.com/mysql/software/percona-distribution-for-mysql

grade: stable
confinement: strict
license: Apache-2.0
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

package-repositories:
  - type: apt
    url: https://repo.percona.com/pdpxc-84-lts/apt
    suites: [resolute]
    components: [main]
    key-id: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
  - type: apt
    url: https://repo.percona.com/telemetry/apt
    suites: [resolute]
    components: [main]
    key-id: 4D1BB29D63D98E422B2113B19334A25F8507EFA5

hooks:
  install:
    plugs:
      - network
      - network-bind
  configure: {}

slots:
  mysql-sockets:
    interface: content
    content: socket-directory
    write:
      - $SNAP_DATA/run

layout:
  /usr/bin/perl:
    bind-file: $SNAP/usr/bin/perl

apps:
