parts:
  packages-deb:
    plugin: nil
    stage-packages:
      - percona-xtradb-cluster-server=1:8.4.10-10-1.resolute
      - percona-xtradb-cluster-client=1:8.4.10-10-1.resolute
      - percona-xtradb-cluster-common=1:8.4.10-10-1.resolute
      - percona-xtradb-cluster-garbd=1:8.4.10-10-1.resolute
      - percona-xtrabackup-84=8.4.0-6-1.resolute
      - proxysql2=2:2.7.3-1.5.resolute
      - percona-haproxy=2:2.8.26-1.resolute
      - percona-replication-manager=2:1.0-1.resolute
      - percona-toolkit=3.7.1-4.resolute
      - libdbd-mysql-perl=1:5.013-4.resolute
      - qpress=11-5.resolute
      - util-linux
      - perl
      - libdbi-perl
      - libterm-readkey-perl
      - libio-socket-ssl-perl
    prime:
      # Percona telemetry agent (pulled in as a hard dependency; not shipped)
      - -usr/bin/percona-telemetry-agent
      - -etc/default
      - -etc/logrotate.d
      - -etc/rsyslog.d
      - -usr/lib/tmpfiles.d
      - -usr/sbin/logrotate
      - -lib/systemd
      - -usr/lib/systemd
      # Host-only integration files that make no sense inside a snap
      - -etc/init.d
      - -etc/apparmor.d
      - -etc/cron.daily
      - -etc/logcheck
      - -usr/bin/garb-systemd
      - -usr/bin/mysql-systemd
      # Test-only tools
      - -usr/bin/mysqltest
      - -usr/bin/mysql_client_test
      - -usr/bin/mysql_keyring_encryption_test
      - -usr/bin/pyclustercheck
      - -usr/bin/pxc_extra/*/bin/xtrabackup-debug
      # Debug plugins
      - -usr/lib/mysql/plugin/debug
      # Mute lint: unused libraries (carried from the percona-server-mysql
      # sibling; harmless if absent, extended by real build lint output)
      - -usr/lib/*/libBrokenLocale.so*
      - -usr/lib/*/libanl.so*
      - -usr/lib/*/libbrotlienc.so*
      - -usr/lib/*/libc_malloc_debug.so*
      - -usr/lib/*/libdl.so*
      - -usr/lib/*/libdrop_ambient.so*
      - -usr/lib/*/libmemusage.so*
      - -usr/lib/*/libmvec.so*
      - -usr/lib/*/libnsl.so*
      - -usr/lib/*/libnss_compat.so*
      - -usr/lib/*/libnss_dns.so*
      - -usr/lib/*/libnss_files.so*
      - -usr/lib/*/libnss_hesiod.so*
      - -usr/lib/*/libpamc.so*
      - -usr/lib/*/libpcprofile.so*
      - -usr/lib/*/libpopt.so*
      - -usr/lib/*/libpthread.so*
      - -usr/lib/*/librt.so*
      - -usr/lib/*/libthread_db.so*
      - -usr/lib/*/libtic.so*
      - -usr/lib/*/libutil.so*
      # Unused-library lint hits from the real PXC build (ncurses form/menu/
      # panel widgets and libcap2-bin's libpsx; nothing in the snap links
      # against them).
      - -usr/lib/*/libformw.so*
      - -usr/lib/*/libmenuw.so*
      - -usr/lib/*/libpanelw.so*
      - -usr/lib/*/libpsx.so*
      # Unused-library lint hits from the real percona-distribution-mysql-pxc
      # build (GMP C++ bindings, GnuTLS dane/openssl compat shims, MIT
      # Kerberos admin client/server libs, and Lua's C++ binding, all pulled
      # in transitively via ProxySQL/curl/libcurl-dev's dependency chain;
      # confirmed via grep -rl across the primed tree that no shipped binary
      # dlopen-references any of them).
      - -usr/lib/*/libgmpxx.so*
      - -usr/lib/*/libgnutls-dane.so*
      - -usr/lib/*/libgnutls-openssl.so*
      # The MIT Kerberos admin libs (libkadm5clnt-mit12, libkadm5srv-mit12,
      # libkdb5-10t64) are NOT stable across rebuilds of the identical pinned
      # dependency chain: one real build placed them directly in
      # usr/lib/<triplet>/, another placed them one level deeper under
      # usr/lib/<triplet>/mit-krb5/ instead (confirmed empirically — same
      # snapcraft.yaml pins, two different repo.percona.com/apt fetches,
      # almost certainly dpkg trigger/update-alternatives ordering variance
      # for this package's postinst, which snapcraft's stage-packages
      # extraction doesn't run). A single "*" glob component doesn't cross
      # "/", so both the flat and nested forms are excluded to be safe
      # against either outcome.
      - -usr/lib/*/libkadm5clnt_mit.so*
      - -usr/lib/*/mit-krb5/libkadm5clnt_mit.so*
      - -usr/lib/*/libkadm5srv_mit.so*
      - -usr/lib/*/mit-krb5/libkadm5srv_mit.so*
      - -usr/lib/*/liblua5.3-c++.so*
      # These two only become "unused" once the excludes directly above are
      # applied (libkdb5 was a dependency of the just-excluded libkadm5*_mit
      # pair, and is subject to the same flat-vs-mit-krb5/-nested placement
      # variance documented above; libunbound was pulled in for GnuTLS
      # DANE/TLSA lookups via the just-excluded libgnutls-dane, and lives
      # directly under usr/lib/<triplet>/) — confirmed via the same
      # zero-dlopen-reference check on a rebuild with the above excludes in
      # place.
      - -usr/lib/*/libkdb5.so*
      - -usr/lib/*/mit-krb5/libkdb5.so*
      - -usr/lib/*/libunbound.so*
      # rsync is incidental apt-recommends noise (no Depends/Recommends chain
      # from any of our 10 pinned packages leads to it, and nothing in this
      # snap invokes it); pruned rather than un-excluding libpopt.so* (a
      # deliberate, sibling-tested exclusion above) to satisfy the library
      # linter's missing-dependency finding.
      - -usr/bin/rsync
      - -usr/bin/rsync-ssl
      - -usr/share/doc/rsync
      - -usr/share/rsync
      - -usr/share/lintian/overrides/rsync
      - -usr/share/man/man1/rsync.1.gz
      - -usr/share/man/man1/rsync-ssl.1.gz
      - -usr/share/man/man5/rsyncd.conf.5.gz
    organize:
      usr/share/doc/percona-xtradb-cluster-server/copyright: licenses/COPYRIGHT-percona-xtradb-cluster-server
      usr/share/doc/percona-xtradb-cluster-client/copyright: licenses/COPYRIGHT-percona-xtradb-cluster-client
      usr/share/doc/percona-xtradb-cluster-common/copyright: licenses/COPYRIGHT-percona-xtradb-cluster-common
      usr/share/doc/percona-xtradb-cluster-garbd/copyright: licenses/COPYRIGHT-percona-xtradb-cluster-garbd
      usr/share/doc/percona-xtrabackup-84/copyright: licenses/COPYRIGHT-percona-xtrabackup-84
      usr/share/doc/proxysql2/copyright: licenses/COPYRIGHT-proxysql2
      usr/share/doc/percona-haproxy/copyright: licenses/COPYRIGHT-percona-haproxy
      # percona-replication-manager ships no copyright file in its deb; nothing to relocate.
      usr/share/doc/percona-toolkit/copyright: licenses/COPYRIGHT-percona-toolkit
      usr/share/doc/libdbd-mysql-perl/copyright: licenses/COPYRIGHT-libdbd-mysql-perl
      usr/share/doc/qpress/copyright: licenses/COPYRIGHT-qpress
      usr/share/doc/perl/copyright: licenses/COPYRIGHT-perl
      usr/share/doc/libdbi-perl/copyright: licenses/COPYRIGHT-libdbi-perl
      usr/share/doc/libterm-readkey-perl/copyright: licenses/COPYRIGHT-libterm-readkey-perl
      usr/share/doc/libio-socket-ssl-perl/copyright: licenses/COPYRIGHT-libio-socket-ssl-perl
      usr/share/doc/util-linux/copyright: licenses/COPYRIGHT-util-linux
      # proxysql2's packaged default config collides at the same stage path
      # (etc/proxysql.cnf) with the seeded config the snap-scripts part
      # installs there; reroute the packaged default out of the way so our
      # own config (rendered by the install hook) is the one that ships.
      etc/proxysql.cnf: usr/share/proxysql2/proxysql.cnf.default
      # Similarly, haproxy's packaged default config collides with the seeded
      # config; reroute it to avoid clobbering our version.
      etc/haproxy/haproxy.cfg: usr/share/percona-haproxy/haproxy.cfg.default
  snap-license:
    plugin: dump
    source: .
    source-type: local
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
  snap-scripts:
    plugin: dump
    source: snap/local
    source-type: local
    override-prime: |
      craftctl default
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' bin/*.sh
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' etc/*.cnf
      sed -i 's/_NAME_/$SNAPCRAFT_PROJECT_NAME/g' etc/*.cfg
