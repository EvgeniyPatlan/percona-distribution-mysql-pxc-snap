project: percona-distribution-mysql-pxc-snap

path: /home/ubuntu/percona-distribution-mysql-pxc-snap

environment:
  CRAFT_ARTIFACT: $(HOST:printenv CRAFT_ARTIFACT)

backends:
  lxd:
    type: lxd
    systems:
      - ubuntu-24.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare: |
      apt remove --purge --yes mysql* percona* || true

exclude:
  - .git

kill-timeout: 1h
